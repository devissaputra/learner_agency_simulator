<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Learner Agency Simulator workflow</title>
<desc id="desc">Learner state and synthetic agency parameters produce a learner action, a system policy produces an offer, support is resolved, and the next learner state is sampled before policy stress testing.</desc>
<rect width="1200" height="300" rx="24" fill="#f7f8fa"/>
<text x="50" y="48" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17202a">Learner Agency Simulator · baseline architecture</text>
<text x="50" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#59636e">Learner choice and system action remain separate before the next-state transition.</text>
<rect x="50" y="120" width="190" height="92" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="75" cy="145" r="14" fill="#38598b"/><text x="75" y="150" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="145" y="147" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">State + agency</text><text x="145" y="168" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">parameters</text>
<line x1="248" y1="166" x2="269.5" y2="166" stroke="#8391a1" stroke-width="2"/><path d="M261.5 160 L269.5 166 L261.5 172" fill="none" stroke="#8391a1" stroke-width="2"/>
<rect x="277.5" y="120" width="190" height="92" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="302.5" cy="145" r="14" fill="#38598b"/><text x="302.5" y="150" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="372.5" y="147" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">Learner action</text><text x="372.5" y="168" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">choice</text>
<line x1="475.5" y1="166" x2="497" y2="166" stroke="#8391a1" stroke-width="2"/><path d="M489 160 L497 166 L489 172" fill="none" stroke="#8391a1" stroke-width="2"/>
<rect x="505" y="120" width="190" height="92" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="530" cy="145" r="14" fill="#38598b"/><text x="530" y="150" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="600" y="147" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">System offer +</text><text x="600" y="168" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">support resolution</text>
<line x1="703" y1="166" x2="724.5" y2="166" stroke="#8391a1" stroke-width="2"/><path d="M716.5 160 L724.5 166 L716.5 172" fill="none" stroke="#8391a1" stroke-width="2"/>
<rect x="732.5" y="120" width="190" height="92" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="757.5" cy="145" r="14" fill="#38598b"/><text x="757.5" y="150" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="827.5" y="147" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">Next-state</text><text x="827.5" y="168" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">transition</text>
<line x1="930.5" y1="166" x2="952" y2="166" stroke="#8391a1" stroke-width="2"/><path d="M944 160 L952 166 L944 172" fill="none" stroke="#8391a1" stroke-width="2"/>
<rect x="960" y="120" width="190" height="92" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="985" cy="145" r="14" fill="#38598b"/><text x="985" y="150" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">5</text>
<text x="1055" y="147" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">Multi-run policy</text><text x="1055" y="168" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">stress test</text>
</svg>