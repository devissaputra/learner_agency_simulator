[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learner-agency-simulator"
version = "0.1.0"
description = "Transparent learner-system interaction simulator for agency-aware adaptive-support policy stress testing."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "ai-in-education",
  "aied",
  "learner-agency",
  "self-regulated-learning",
  "adaptive-learning",
  "learner-simulation",
  "policy-stress-testing",
  "human-centered-ai",
]

[project.urls]
Repository = "https://github.com/devissaputra/learner_agency_simulator"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
