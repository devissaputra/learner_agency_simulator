<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Learner Agency Simulator synthetic demo snapshot</title>
<desc id="desc">Synthetic learner-system interaction demo with four states, learner choice, proactive system support, policy comparison and sensitivity testing.</desc>
<rect width="1200" height="330" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic learner–system interaction demo</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">One trajectory + multi-seed policy comparison + transition sensitivity. No human data.</text>
<rect x="52" y="112" width="250" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Task states</text>
<text x="70" y="170" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">4 distinct dynamics</text>
<rect x="320" y="112" width="250" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Learner agency</text>
<text x="338" y="170" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">8 possible actions</text>
<rect x="588" y="112" width="250" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">System support</text>
<text x="606" y="170" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">5 possible offers</text>
<rect x="856" y="112" width="292" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Stress test</text>
<text x="874" y="170" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">4 policies × multiple scenarios</text>
<text x="52" y="260" font-family="Arial" font-size="14" fill="#d1d5db">Metrics include mastery/disengagement occupancy, learner support requests, interventions, refusals, and recovery.</text>
<text x="52" y="290" font-family="Arial" font-size="13" fill="#8995a5">Simulation results describe the model configuration, not real learner outcomes.</text>
</svg>